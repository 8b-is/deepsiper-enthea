<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#040d21" />
      <stop offset="80%" stop-color="#051b38" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sonarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Hydrodynamic Sine Waves -->
  <path d="M0,420 Q300,380 600,430 T1200,400 L1200,630 L0,630 Z" fill="rgba(6, 182, 212, 0.05)" stroke="rgba(6, 182, 212, 0.2)" stroke-width="2" />
  <path d="M0,480 Q350,440 700,500 T1200,460 L1200,630 L0,630 Z" fill="rgba(14, 116, 144, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  <path d="M0,540 Q250,510 600,560 T1200,520 L1200,630 L0,630 Z" fill="rgba(30, 58, 138, 0.12)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" />

  <!-- Bioluminescent Leviathan Whale Artwork -->
  <g transform="translate(860, 290) scale(0.95)" filter="url(#glowFilter)">
    <!-- Whale Body -->
    <path d="M120,0 C60,-44 -24,-38 -96,-11 Q-132,4 -168,12 L-196,-8 Q-180,12 -168,12 L-196,32 Q-172,16 -108,16 C-24,49 60,44 120,0 Z"
          fill="url(#whaleGrad)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Fin -->
    <path d="M24,16 Q12,58 -36,48 Q-12,24 24,16 Z" fill="rgba(14, 165, 233, 0.5)" stroke="#38bdf8" stroke-width="2" />
    <!-- Eye -->
    <circle cx="92" cy="-6" r="4" fill="#38bdf8" />
    <!-- Ventral Pleats -->
    <path d="M84,10 Q24,28 -24,18" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" fill="none" />
    <path d="M72,16 Q20,32 -16,22" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" fill="none" />
    <!-- Sonar Acoustic Rings from Blowhole -->
    <circle cx="72" cy="-22" r="28" stroke="rgba(56, 189, 248, 0.7)" stroke-width="1.5" fill="none" opacity="0.8" />
    <circle cx="72" cy="-22" r="54" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.5" fill="none" opacity="0.5" />
    <circle cx="72" cy="-22" r="82" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1" fill="none" opacity="0.3" />
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(90, 110)">
    <!-- Tag Badge -->
    <g transform="translate(0, 0)">
      <rect width="360" height="36" rx="18" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" />
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">
        SOVEREIGN LEVIATHAN HARNESS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Deepsiper Enthea
    </text>

    <!-- Subtitle / Domain -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#cyanGlow)" letter-spacing="-0.5">
      deepsiper.vaked.dev
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Sovereign, agent-driven LLM evaluation harness forked from dsh.
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Air-gapped EntheAI reasoning, Landlock isolation, and Cordis kernel.
    </text>

    <!-- Pill Features Matrix -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="14" y="25" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13" font-weight="600" fill="#38bdf8">⚡ TypeScript 6</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="175" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="194" y="25" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13" font-weight="600" fill="#10b981">🛡️ Landlock v3</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="180" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="384" y="25" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13" font-weight="600" fill="#a855f7">🐋 Cordis Engine</text>
    </g>

    <!-- Footer Bar -->
    <g transform="translate(0, 390)">
      <text x="0" y="20" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="14" fill="#64748b">
        github.com/8b-is/deepsiper-enthea · MIT License
      </text>
    </g>
  </g>
</svg>
